<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The B.Tech Batch — Ambient 90s Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    /* COLORS MATCHED TO THE "B.TECH BATCH" COMIC PALETTE */
    :root {
      --bg-dark: #1a0f0a;
      --card-bg: #2a1b14; /* Warm brownish from the car interior */
      --card-border: #422d22;
      --accent-orange: #e05a2b; /* Bold orange from the comic title */
      --accent-yellow: #f4b41a; /* Warm yellow from the t-shirt */
      --text-light: #f5ebe6; /* Creamy light text */
      --text-dim: #a39288;
      --tape-window-bg: #0d0806;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      
      /* INTEGRATING YOUR NEW COMIC WALLPAPER */
      background-image: url('background.png'); /* Assumes file is named background.png */
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    /* Subtle screen scanline effect */
    .screen-effect {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(0,0,0,0) 2px);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 480px;
      text-align: center;
      padding: 20px;
    }

    /* Signboard Header */
    .signboard {
      border: 3px solid var(--accent-orange);
      padding: 15px 20px;
      border-radius: 8px;
      /* Slightly translucent background to let image peek through */
      background: rgba(42, 27, 20, 0.9); 
      box-shadow: 0 0 25px rgba(224, 90, 43, 0.4);
      margin-bottom: 25px;
    }

    .signboard h2 {
      font-family: 'Rozha One', serif;
      font-size: 2.2rem;
      color: var(--accent-yellow);
      letter-spacing: 1px;
    }

    .signboard p {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .on-air {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #555;
      border-radius: 50%;
      margin-right: 6px;
    }

    .on-air.active {
      background-color: #ff3333;
      box-shadow: 0 0 8px #ff3333;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Deck Player Styling */
    .cassette-deck {
      background: rgba(42, 27, 20, 0.95); /* Slightly translucent */
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 15px 45px rgba(0,0,0,0.8);
    }

    /* Spinning Reels Animation */
    .tape-window {
      background: var(--tape-window-bg);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .reel {
      width: 45px;
      height: 45px;
      border: 4px dashed var(--accent-orange);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .spinning {
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Track Metadata */
    .track-info {
      margin-bottom: 20px;
    }

    .song-title {
      font-size: 1.0rem;
      font-weight: bold;
      color: var(--text-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .artist-name {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1a0f0a;
      border: 1px solid var(--card-border);
      color: var(--text-light);
      padding: 12px 20px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-orange);
      border-color: var(--accent-orange);
      color: #fff;
    }

    .btn:active {
      transform: translateY(2px);
    }
    
    #playBtn {
      border-color: var(--accent-orange);
      color: var(--accent-orange);
    }

    /* Hidden YouTube Container */
    #yt-player-container {
      position: fixed;
      left: -9999px;
      bottom: 0;
      width: 200px;
      height: 200px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="screen-effect"></div>

  <div class="container">
    <!-- Signboard Header -->
    <div class="signboard">
      <h2>The B.Tech Batch</h2>
      <p><span class="on-air" id="onAirTag"></span> Engineering Classics '09–'13</p>
    </div>

    <!-- Cassette Player UI -->
    <div class="cassette-deck">
      <div class="tape-window">
        <div class="reel" id="reelLeft"></div>
        <div class="reel" id="reelRight"></div>
      </div>

      <div class="track-info">
        <div class="song-title" id="songTitle">Press Play to Load Tape</div>
        <div class="artist-name" id="artistName">B.Tech Batch Radio 90.0 FM</div>
      </div>

      <!-- Playback Buttons -->
      <div class="controls">
        <button class="btn" id="prevBtn">◄◄</button>
        <button class="btn" id="playBtn">▶ Play</button>
        <button class="btn" id="nextBtn">►►</button>
      </div>

    </div>
  </div>

  <!-- Hidden YouTube Player Container (Offscreen) -->
  <div id="yt-player-container">
    <div id="player"></div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // Playlist ID provided by the user
    const PLAYLIST_ID = 'PL_tHW6DB1saER9hFv3EniaXQw5ZCUBhpn';

    let player;
    let isPlayerReady = false;
    let isPlaying = false;

    // Initialize the YouTube Player with your playlist
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        playerVars: {
          'listType': 'playlist',
          'list': PLAYLIST_ID,
          'playsinline': 1,
          'controls': 0,
          'origin': window.location.origin,
          'enablejsapi': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // UI Elements
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const reelLeft = document.getElementById('reelLeft');
    const reelRight = document.getElementById('reelRight');
    const onAirTag = document.getElementById('onAirTag');

    function onPlayerReady(event) {
      isPlayerReady = true;
      songTitle.textContent = "Tape Loaded";
      artistName.textContent = "National Chai Tapri Station";
    }

    function togglePlay() {
      if (!isPlayerReady || !player) return;

      if (isPlaying) {
        player.pauseVideo();
        isPlaying = false;
        updatePlayStateUI(false);
      } else {
        // Crucial for deployment sound: unmute and set volume on click
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        isPlaying = true;
        updatePlayStateUI(true);
      }
    }

    function nextTrack() {
      if (player && isPlayerReady) {
        player.nextVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function prevTrack() {
      if (player && isPlayerReady) {
        player.previousVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function updatePlayStateUI(active) {
      if (active) {
        playBtn.textContent = '❚❚ Pause';
        reelLeft.classList.add('spinning');
        reelRight.classList.add('spinning');
        onAirTag.classList.add('active');
      } else {
        playBtn.textContent = '▶ Play';
        reelLeft.classList.remove('spinning');
        reelRight.classList.remove('spinning');
        onAirTag.classList.remove('active');
      }
    }

    function onPlayerStateChange(event) {
      // When a video starts playing (State: 1 / PLAYING)
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayStateUI(true);

        // Fetch current video title dynamically from YouTube metadata
        const videoData = player.getVideoData();
        if (videoData && videoData.title) {
          // Tweak the title display for cleaner look
          let cleanTitle = videoData.title.split('|')[0].trim();
          songTitle.textContent = cleanTitle;
          artistName.textContent = videoData.author || "National Chai Tapri Radio";
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayStateUI(false);
      }
    }

    // Button Listeners
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
  </script>
</body>
</html>
