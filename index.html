<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The B.Tech Batch — Ambient 90s Radio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #120c0a;
      --card-bg: rgba(28, 18, 14, 0.92);
      --card-border: #523726;
      --accent-orange: #ff5e28;
      --accent-yellow: #f5b027;
      --text-light: #ffffff;
      --text-dim: #c7b2a6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh; /* Perfect sizing on mobile toolbars */
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Places deck naturally above the car dashboard */
      padding: 16px;
      overflow-x: hidden;
      
      /* Mobile-optimized responsive background */
      background-image: url('background.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Subtle CRT scanline overlay */
    .screen-effect {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0) 2px);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      margin-bottom: 15px;
    }

    /* Signboard Header */
    .signboard {
      border: 2px solid var(--accent-orange);
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(18, 10, 6, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      text-align: center;
      margin-bottom: 12px;
    }

    .signboard h2 {
      font-family: 'Rozha One', serif;
      font-size: 1.6rem;
      color: var(--accent-yellow);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .signboard p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .on-air {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #555;
      border-radius: 50%;
    }

    .on-air.active {
      background-color: #ff3333;
      box-shadow: 0 0 8px #ff3333;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Cassette Player Deck */
    .cassette-deck {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      text-align: center;
    }

    /* Tape Window & Spinning Hubs */
    .tape-window {
      background: #090504;
      border: 2px solid #332017;
      border-radius: 8px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 14px;
      position: relative;
    }

    .reel {
      width: 38px;
      height: 38px;
      border: 3px dashed var(--accent-orange);
      border-radius: 50%;
    }

    .spinning {
      animation: spin 2.8s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Track Display Screen */
    .track-info {
      background: #0e0806;
      border: 1px solid #332017;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }

    .song-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist-name {
      font-size: 0.72rem;
      color: var(--text-dim);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mechanical Tape Deck Controls */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 10px;
      align-items: center;
    }

    .btn {
      background: #251610;
      border: 1px solid #4a2e1f;
      color: var(--text-light);
      padding: 12px 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* Highlighted Main Play Button */
    .btn-play {
      background: var(--accent-orange);
      border-color: #ff8154;
      color: #ffffff;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(255, 94, 40, 0.4);
    }

    .btn-play:active {
      background: #e04b16;
    }

    /* Hidden YouTube Player */
    #yt-player-container {
      position: fixed;
      left: -9999px;
      bottom: 0;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }

    /* Desktop View Tweaks */
    @media (min-width: 600px) {
      body {
        justify-content: center;
        background-position: center center;
      }
      .signboard h2 {
        font-size: 2rem;
      }
      .cassette-deck {
        padding: 22px;
      }
      .tape-window {
        height: 85px;
      }
      .reel {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>

  <div class="screen-effect"></div>

  <div class="container">
    <!-- Signboard Header -->
    <div class="signboard">
      <h2>The B.Tech Batch</h2>
      <p><span class="on-air" id="onAirTag"></span> Engineering Classics '09–'13</p>
    </div>

    <!-- Cassette Player UI -->
    <div class="cassette-deck">
      <div class="tape-window">
        <div class="reel" id="reelLeft"></div>
        <div class="reel" id="reelRight"></div>
      </div>

      <div class="track-info">
        <div class="song-title" id="songTitle">Tap Play to Start</div>
        <div class="artist-name" id="artistName">B.Tech Batch 90.0 FM</div>
      </div>

      <!-- Controls Grid -->
      <div class="controls">
        <button class="btn" id="prevBtn" aria-label="Previous Track">◄◄ Prev</button>
        <button class="btn btn-play" id="playBtn" aria-label="Play or Pause">▶ PLAY</button>
        <button class="btn" id="nextBtn" aria-label="Next Track">Next ►►</button>
      </div>
    </div>
  </div>

  <!-- Offscreen YouTube Player -->
  <div id="yt-player-container">
    <div id="player"></div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const PLAYLIST_ID = 'PL_tHW6DB1saER9hFv3EniaXQw5ZCUBhpn';

    let player;
    let isPlayerReady = false;
    let isPlaying = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        playerVars: {
          'listType': 'playlist',
          'list': PLAYLIST_ID,
          'playsinline': 1,
          'controls': 0,
          'origin': window.location.origin,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => {
            isPlayerReady = true;
          },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const reelLeft = document.getElementById('reelLeft');
    const reelRight = document.getElementById('reelRight');
    const onAirTag = document.getElementById('onAirTag');

    function togglePlay() {
      if (!isPlayerReady || !player) return;

      if (isPlaying) {
        player.pauseVideo();
        isPlaying = false;
        updatePlayStateUI(false);
      } else {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
        isPlaying = true;
        updatePlayStateUI(true);
      }
    }

    function nextTrack() {
      if (player && isPlayerReady) {
        player.nextVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function prevTrack() {
      if (player && isPlayerReady) {
        player.previousVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function updatePlayStateUI(active) {
      if (active) {
        playBtn.textContent = '❚❚ PAUSE';
        reelLeft.classList.add('spinning');
        reelRight.classList.add('spinning');
        onAirTag.classList.add('active');
      } else {
        playBtn.textContent = '▶ PLAY';
        reelLeft.classList.remove('spinning');
        reelRight.classList.remove('spinning');
        onAirTag.classList.remove('active');
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayStateUI(true);

        const videoData = player.getVideoData();
        if (videoData && videoData.title) {
          let cleanTitle = videoData.title.split('|')[0].trim();
          songTitle.textContent = cleanTitle;
          artistName.textContent = videoData.author || "B.Tech Batch Radio";
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayStateUI(false);
      }
    }

    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
  </script>
</body>
</html>
