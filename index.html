<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Millennials' 20s FM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Rozha+One&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-orange: #ff5500;
      --vibrant-yellow: #ffb800;
      /* Ultra-sheer transparent glass background */
      --glass-bg: rgba(15, 9, 6, 0.38);
      --glass-border: rgba(255, 255, 255, 0.22);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
    }

    body {
      background-color: #0d0705;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 16px;
      overflow-x: hidden;
      
      /* Comic Wallpaper */
      background-image: url('background.png');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .player-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    /* Ultra Transparent Frosted Glass Deck */
    .player-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 18px 22px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    /* Minimal Header Tag */
    .station-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .tag-title {
      font-family: 'Rozha One', serif;
      font-size: 1.2rem;
      color: var(--vibrant-yellow);
      letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 85, 0, 0.25);
      border: 1px solid rgba(255, 85, 0, 0.5);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #ff9d66;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #777;
      border-radius: 50%;
    }

    .live-dot.active {
      background: var(--neon-orange);
      box-shadow: 0 0 8px var(--neon-orange);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Track Meta with High Readability Shadows */
    .track-details {
      margin-bottom: 14px;
    }

    .track-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .track-artist {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    /* Forward / Progress Seek Bar */
    .progress-section {
      margin-bottom: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, var(--vibrant-yellow), var(--neon-orange));
      border-radius: 6px;
      box-shadow: 0 0 12px rgba(255, 85, 0, 0.7);
      transition: width 0.15s linear;
    }

    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 5px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* Modern Minimal Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      backdrop-filter: blur(4px);
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn-action svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Vibrant Glowing Main Play Button */
    .btn-main-play {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--vibrant-yellow), var(--neon-orange));
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(255, 85, 0, 0.55);
      transition: all 0.2s ease;
    }

    .btn-main-play:active {
      transform: scale(0.92);
      box-shadow: 0 3px 10px rgba(255, 85, 0, 0.4);
    }

    .btn-main-play svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Offscreen hidden player */
    #yt-player-container {
      position: fixed;
      left: -9999px;
      bottom: 0;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }

    @media (min-width: 600px) {
      body {
        justify-content: center;
        background-position: center center;
      }
      .player-card {
        padding: 22px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <div class="player-card">
      
      <!-- Minimal Header -->
      <div class="station-tag">
        <span class="tag-title">The B.Tech Batch</span>
        <div class="badge-live">
          <span class="live-dot" id="liveDot"></span>
          <span>20's FM</span>
        </div>
      </div>

      <!-- Track Information -->
      <div class="track-details">
        <div class="track-title" id="songTitle">Tap Play to Start</div>
        <div class="track-artist" id="artistName">Engineering Roadtrip Classics</div>
      </div>

      <!-- Forward / Seek Bar -->
      <div class="progress-section">
        <div class="progress-bar-container" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-stamps">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <!-- Vibrant Minimal Controls -->
      <div class="controls">
        <!-- Prev Button -->
        <button class="btn-action" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- Main Play Button -->
        <button class="btn-main-play" id="playBtn" aria-label="Play or Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- Next Button -->
        <button class="btn-action" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Offscreen YouTube Player Container -->
  <div id="yt-player-container">
    <div id="player"></div>
  </div>

  <!-- YouTube Iframe API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const PLAYLIST_ID = 'PL_tHW6DB1saER9hFv3EniaXQw5ZCUBhpn';

    let player;
    let isPlayerReady = false;
    let isPlaying = false;
    let progressInterval = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '200',
        width: '200',
        playerVars: {
          'listType': 'playlist',
          'list': PLAYLIST_ID,
          'playsinline': 1,
          'controls': 0,
          'origin': window.location.origin,
          'enablejsapi': 1
        },
        events: {
          'onReady': () => { isPlayerReady = true; },
          'onStateChange': onPlayerStateChange
        }
      });
    }

    // UI Elements
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitle = document.getElementById('songTitle');
    const artistName = document.getElementById('artistName');
    const liveDot = document.getElementById('liveDot');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    // Format Seconds to MM:SS
    function formatTime(seconds) {
      if (isNaN(seconds) || seconds === null) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Toggle Play/Pause
    function togglePlay() {
      if (!isPlayerReady || !player) return;

      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function nextTrack() {
      if (player && isPlayerReady) {
        player.nextVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    function prevTrack() {
      if (player && isPlayerReady) {
        player.previousVideo();
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
    }

    // Update Progress & Timestamps
    function updateProgress() {
      if (!player || !isPlaying) return;
      const current = player.getCurrentTime() || 0;
      const duration = player.getDuration() || 0;

      if (duration > 0) {
        const percent = (current / duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(current);
        totalDurationEl.textContent = formatTime(duration);
      }
    }

    // Click/Drag on Forward Bar to Seek
    function seek(e) {
      if (!player || !isPlayerReady) return;
      const rect = progressBar.getBoundingClientRect();
      const clickX = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const width = rect.width;
      const percentage = Math.max(0, Math.min(1, clickX / width));
      const duration = player.getDuration();

      if (duration) {
        const seekTime = duration * percentage;
        player.seekTo(seekTime, true);
        progressFill.style.width = `${percentage * 100}%`;
        currentTimeEl.textContent = formatTime(seekTime);
      }
    }

    progressBar.addEventListener('click', seek);

    // Player State Change Handler
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause SVG
        liveDot.classList.add('active');

        // Dynamic Title
        const videoData = player.getVideoData();
        if (videoData && videoData.title) {
          songTitle.textContent = videoData.title.split('|')[0].trim();
          artistName.textContent = videoData.author || "B.Tech Batch 20's FM";
        }

        clearInterval(progressInterval);
        progressInterval = setInterval(updateProgress, 500);
      } else {
        isPlaying = false;
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play SVG
        liveDot.classList.remove('active');
        clearInterval(progressInterval);
      }
    }

    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
  </script>
</body>
</html>
